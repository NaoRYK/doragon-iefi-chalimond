name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Correr los tests
        run: npm test

  deploy:
    name: Publicar en Vercel
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Aviso si faltan las credenciales de Vercel
        if: env.VERCEL_TOKEN == ''
        run: echo "::notice::Faltan los secretos de Vercel, no se publica."
      - uses: actions/checkout@v4
        if: env.VERCEL_TOKEN != ''
      - uses: actions/setup-node@v4
        if: env.VERCEL_TOKEN != ''
        with:
          node-version: 22
      - name: Instalar Vercel CLI
        if: env.VERCEL_TOKEN != ''
        run: npm install --global vercel@latest
      - name: Traer la configuración del proyecto
        if: env.VERCEL_TOKEN != ''
        run: vercel pull --yes --environment=production
      - name: Construir
        if: env.VERCEL_TOKEN != ''
        run: vercel build --prod
      - name: Publicar
        if: env.VERCEL_TOKEN != ''
        run: vercel deploy --prebuilt --prod
